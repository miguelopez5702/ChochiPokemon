<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="description" content="Chochi vs Contrato de Trabajo - Edición BMW Turbo Premium">
    <title>Chochi vs Contrato: BMW Turbo Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* ESTILO VAPORWAVE / NEO-RETRO / ARCADE PREMIUM */
        :root {
            --bg-color: #0b071e;
            --grid-color: rgba(255, 0, 127, 0.15);
            --neon-pink: #ff007f;
            --neon-blue: #00f3ff;
            --neon-green: #39ff14;
            --neon-yellow: #ffea00;
            --text-primary: #ffffff;
            --text-secondary: #b0a8d3;
            --panel-bg: rgba(15, 8, 38, 0.85);
            --border-glow: 2px solid rgba(255, 0, 127, 0.4);
            --font-display: 'Press Start 2P', monospace;
            --font-sans: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #04020a;
            color: var(--text-primary);
            font-family: var(--font-sans);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Contenedor principal con relación de aspecto */
        #game-container {
            width: 100%;
            height: 100%;
            max-width: 500px;
            max-height: 850px;
            background: radial-gradient(circle at center, #1b103c 0%, #06030f 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            border: 4px solid #11092c;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.25), 0 0 60px rgba(255, 0, 127, 0.15);
            overflow: hidden;
        }

        /* Botón de Audio flotante */
        #audio-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 100;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(5px);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        #audio-toggle:hover {
            transform: scale(1.1);
            background: rgba(0, 243, 255, 0.2);
            border-color: var(--neon-blue);
        }

        /* ===== PANTALLAS ===== */
        .screen {
            position: absolute;
            inset: 0;
            display: none;
            flex-direction: column;
            padding: 20px;
        }
        .screen.active {
            display: flex;
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(1.02); }
            to { opacity: 1; transform: scale(1); }
        }

        /* ===== PANTALLA DE INICIO (TITLE) ===== */
        #title-screen {
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(180deg, #0b071e 0%, #150933 100%);
            z-index: 10;
        }

        /* Cuadrícula Vaporwave */
        .grid-bg {
            position: absolute;
            inset: 0;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: center;
            transform: perspective(300px) rotateX(60deg) translateY(-30%);
            transform-origin: top;
            opacity: 0.8;
            z-index: 1;
            pointer-events: none;
        }

        .title-header {
            margin-top: 60px;
            text-align: center;
            z-index: 2;
        }

        .title-sub {
            font-family: var(--font-display);
            font-size: 12px;
            color: var(--neon-blue);
            text-shadow: 0 0 10px rgba(0, 243, 255, 0.8);
            letter-spacing: 2px;
            margin-bottom: 20px;
            animation: pulse 1.5s infinite alternate;
        }

        .title-main {
            font-family: var(--font-display);
            font-size: clamp(24px, 7vw, 36px);
            line-height: 1.4;
            background: linear-gradient(to bottom, #fff 20%, #ff007f 60%, #9900ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(255, 0, 127, 0.6));
            text-transform: uppercase;
        }

        /* Mini coche decorativo en menú */
        .decor-car {
            z-index: 2;
            width: 180px;
            height: 100px;
            animation: idleFloat 3s ease-in-out infinite alternate;
        }

        .start-container {
            width: 100%;
            text-align: center;
            z-index: 2;
            margin-bottom: 60px;
        }

        .btn-premium {
            width: 100%;
            max-width: 320px;
            padding: 16px 28px;
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, var(--neon-pink) 0%, #9000ff 100%);
            border: 2px solid #fff;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5), inset 0 0 10px rgba(255, 255, 255, 0.3);
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }
        .btn-premium::before {
            content: '';
            position: absolute;
            top: 0; left: -50%; width: 200%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.25), transparent);
            transform: skewX(-30deg);
            transition: 0.75s;
        }
        .btn-premium:hover::before {
            left: 120%;
        }
        .btn-premium:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.8), 0 0 10px rgba(0, 243, 255, 0.5);
        }
        .btn-premium:active {
            transform: scale(0.95);
        }

        .footer-credits {
            font-size: 10px;
            color: var(--text-secondary);
            letter-spacing: 1px;
            z-index: 2;
        }

        /* ===== PANTALLA DE COMBATE ===== */
        #battle-screen {
            padding: 0;
            justify-content: space-between;
        }

        /* Zona de combate */
        .battle-arena {
            flex: 1;
            position: relative;
            background: radial-gradient(circle at bottom, #1d0f3a 0%, #070313 100%);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Canvas de efectos de partículas */
        #effects-canvas {
            position: absolute;
            inset: 0;
            z-index: 20;
            pointer-events: none;
        }

        /* Grid en la base del combate */
        .arena-grid {
            position: absolute;
            bottom: 0; left: 0; right: 0; height: 40%;
            background-image: linear-gradient(var(--grid-color) 1px, transparent 1px), linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 25px 25px;
            transform: perspective(120px) rotateX(45deg);
            transform-origin: bottom;
            opacity: 0.6;
            z-index: 1;
        }

        /* Estaciones de los luchadores (Plataforma + Sprite agrupados y centrados) */
        .fighter-station {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end;
            z-index: 5;
        }
        .fighter-station.enemy-station {
            top: 22%;
            right: 40px;
            width: 200px;
            height: 200px;
        }
        .fighter-station.player-station {
            bottom: 35px;
            left: 30px;
            width: 240px;
            height: 240px;
        }

        /* Plataformas retro con brillo de neón */
        .ring-platform {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 70px; /* altura fija para mantener ratio de elipse 3D */
            border-radius: 50%;
            background: radial-gradient(ellipse at center, rgba(0, 243, 255, 0.25) 0%, transparent 70%);
            border: 2px dashed rgba(0, 243, 255, 0.35);
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.3);
            transform: scaleY(0.35);
            z-index: 1;
        }
        .enemy-station .ring-platform {
            border-color: rgba(255, 0, 127, 0.4);
            background: radial-gradient(ellipse at center, rgba(255, 0, 127, 0.2) 0%, transparent 70%);
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.25);
        }

        /* Sprite Wrappers (Posicionados perfectamente centrados sobre sus plataformas) */
        .sprite-wrapper {
            position: absolute;
            bottom: 20px; /* Coloca el sprite directamente en el centro vertical de la elipse */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }
        .enemy-station .sprite-wrapper {
            width: 155px; /* ¡Más grande y claro! */
            height: 155px;
        }
        .player-station .sprite-wrapper {
            width: 195px; /* Chochi notablemente más grande */
            height: 195px;
        }

        /* Imagen de sprites */
        .sprite-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.2s ease;
        }
        .player-station .sprite-img {
            filter: drop-shadow(0 0 20px rgba(0, 243, 255, 0.5));
        }
        .enemy-station .sprite-img {
            filter: drop-shadow(0 0 20px rgba(255, 0, 127, 0.5));
        }

        /* Contenedores absolutos para las Tarjetas de HP */
        .hp-card-wrapper {
            position: absolute;
            width: 215px;
            z-index: 10;
            transition: all 0.3s ease;
        }
        .hp-card-wrapper.enemy-hp {
            top: 25px;
            left: 15px;
        }
        .hp-card-wrapper.player-hp {
            bottom: 40px;
            right: 15px;
        }

        /* Animación: Ataques */
        .attack-dash-right { animation: dashRight 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        .attack-dash-left { animation: dashLeft 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); }
        
        @keyframes dashRight {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -20px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }
        @keyframes dashLeft {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(-40px, 20px) scale(1.1); }
            100% { transform: translate(0, 0) scale(1); }
        }

        /* Animación: Recibir Daño (Hit) */
        .damage-blink { animation: damageBlink 0.35s linear; }
        @keyframes damageBlink {
            0%, 100% { opacity: 1; filter: invert(0) brightness(1); }
            20%, 60% { opacity: 0.3; filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg) brightness(1.5); }
            40%, 80% { opacity: 0.9; filter: invert(0) brightness(2); }
        }

        /* Animación: Debilitado (Faint) */
        .faint-sink { animation: faintSink 0.8s cubic-bezier(0.6, -0.28, 0.735, 0.045) forwards; }
        @keyframes faintSink {
            to { transform: translateY(80px) rotate(15deg); opacity: 0; filter: blur(5px); }
        }

        /* Animación: Curación (Glow) */
        .heal-glow { animation: healGlow 0.8s ease-out; }
        @keyframes healGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.4)); }
            50% { filter: drop-shadow(0 0 35px var(--neon-green)) brightness(1.2); }
        }

        /* Tarjetas de HP Glassmorphic */
        .hp-card {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            width: 100%;
            border-left: 4px solid var(--neon-blue);
        }
        .enemy-box .hp-card {
            grid-column: 1;
            border-left: none;
            border-right: 4px solid var(--neon-pink);
        }

        .hp-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .hp-name {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .player-box .hp-name { color: var(--neon-blue); text-shadow: 0 0 5px rgba(0, 243, 255, 0.3); }
        .enemy-box .hp-name { color: var(--neon-pink); text-shadow: 0 0 5px rgba(255, 0, 127, 0.3); }

        .hp-lvl {
            font-family: var(--font-display);
            font-size: 8px;
            color: var(--text-secondary);
        }

        .hp-track {
            width: 100%;
            height: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
            padding: 1px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 4px;
            position: relative;
            overflow: hidden;
        }

        .hp-fill {
            height: 100%;
            border-radius: 4px;
            width: 100%;
            background: linear-gradient(90deg, #00f3ff, #00ff66);
            box-shadow: 0 0 10px rgba(0, 243, 255, 0.5);
            transition: width 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }
        .enemy-box .hp-fill {
            background: linear-gradient(90deg, #ff007f, #ff6600);
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .hp-values {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: right;
            font-weight: 600;
        }

        /* Textos flotantes de daño/curación */
        .floating-num {
            position: absolute;
            z-index: 50;
            font-family: var(--font-display);
            font-size: 18px;
            font-weight: bold;
            pointer-events: none;
            animation: floatUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.8);
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            20% { transform: translateY(-20px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-60px) scale(1); opacity: 0; }
        }

        /* ===== Coche BMW Elemento Animable ===== */
        #bmw-actor {
            position: absolute;
            bottom: 40px;
            left: -250px;
            width: 250px;
            height: 140px;
            z-index: 30;
            pointer-events: none;
            display: none;
            transition: transform 0.05s linear;
        }
        .bmw-svg {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5)) drop-shadow(0 0 10px rgba(0, 243, 255, 0.4));
        }

        /* ===== UI PANEL (TEXTO Y CONTROLES) ===== */
        .control-panel {
            background: #090516;
            border-top: 2px solid rgba(255, 0, 127, 0.25);
            display: flex;
            flex-direction: column;
            height: 38%;
            position: relative;
            z-index: 40;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Cuadro de Diálogo Principal */
        .dialogue-card {
            flex: 1;
            padding: 15px 20px;
            display: flex;
            position: relative;
            align-items: center;
            cursor: pointer;
        }

        .dialogue-text {
            font-size: clamp(12px, 3.5vw, 15px);
            line-height: 1.6;
            color: var(--text-primary);
            font-weight: 500;
            width: 100%;
            padding-right: 20px;
        }

        .dialogue-arrow {
            position: absolute;
            bottom: 12px;
            right: 20px;
            font-size: 12px;
            color: var(--neon-blue);
            animation: arrowBlink 0.6s infinite alternate;
            display: none;
        }
        @keyframes arrowBlink {
            from { opacity: 0.2; transform: translateY(0); }
            to { opacity: 1; transform: translateY(3px); }
        }

        /* Panel de Acción (Ataques) */
        .action-grid {
            position: absolute;
            inset: 0;
            background: #090516;
            display: none;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            padding: 8px;
        }
        .action-grid.active {
            display: grid;
            animation: slideUp 0.25s ease-out forwards;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* Botones de Ataque Premium */
        .btn-attack {
            background: linear-gradient(135deg, rgba(27, 16, 56, 0.8) 0%, rgba(13, 7, 28, 0.9) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #fff;
            font-family: var(--font-sans);
            font-size: 13px;
            font-weight: 600;
            padding: 10px 14px;
            text-align: left;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .btn-attack::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0; width: 4px;
            background: var(--neon-blue);
            opacity: 0.6;
        }
        /* Colores distintivos según ataque */
        .btn-attack:nth-child(2)::before { background: var(--neon-pink); }
        .btn-attack:nth-child(3)::before { background: var(--neon-yellow); }
        .btn-attack:nth-child(4)::before { background: var(--neon-green); }

        .btn-attack:hover:not(:disabled) {
            background: linear-gradient(135deg, rgba(39, 23, 82, 0.9) 0%, rgba(20, 11, 43, 0.95) 100%);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px rgba(0, 243, 255, 0.2);
            transform: translateY(-2px);
        }
        .btn-attack:active:not(:disabled) {
            transform: translateY(0);
        }
        .btn-attack:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            filter: grayscale(0.8);
        }

        .btn-attack .atk-title {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }
        .btn-attack .atk-desc {
            font-size: 9px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }
        .btn-attack .atk-pp {
            font-family: var(--font-display);
            font-size: 7px;
            color: var(--neon-blue);
            align-self: flex-end;
            margin-top: 4px;
        }

        /* ===== PANTALLA DE RESULTADOS ===== */
        #result-screen {
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(180deg, #06030f 0%, #17072f 100%);
            z-index: 50;
        }

        .result-glow-box {
            background: rgba(13, 7, 30, 0.8);
            border: 2px solid var(--neon-blue);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 0 30px rgba(0, 243, 255, 0.4);
            margin-bottom: 40px;
        }
        #result-screen.defeat .result-glow-box {
            border-color: var(--neon-pink);
            box-shadow: 0 0 30px rgba(255, 0, 127, 0.4);
        }

        .result-title {
            font-family: var(--font-display);
            font-size: 22px;
            margin-bottom: 20px;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
        }
        .win-text { color: var(--neon-blue); text-shadow: 0 0 10px rgba(0, 243, 255, 0.7); }
        .lose-text { color: var(--neon-pink); text-shadow: 0 0 10px rgba(255, 0, 127, 0.7); }

        .result-message {
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .result-stats {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            font-size: 12px;
            color: var(--neon-yellow);
            font-family: var(--font-display);
            line-height: 1.5;
        }

        /* ===== ANIMACIONES GENERALES ===== */
        @keyframes pulse {
            from { opacity: 0.6; text-shadow: 0 0 5px rgba(0, 243, 255, 0.5); }
            to { opacity: 1; text-shadow: 0 0 15px rgba(0, 243, 255, 1); }
        }
        @keyframes idleFloat {
            from { transform: translateY(0px) rotate(0deg); }
            to { transform: translateY(-10px) rotate(-3deg); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- BOTÓN SILENCIO -->
        <button id="audio-toggle" title="Activar/Silenciar Sonido">🔊</button>

        <!-- PANTALLA TÍTULO -->
        <div class="screen active" id="title-screen">
            <div class="grid-bg"></div>
            
            <div class="title-header">
                <div class="title-sub">Donette Fighter 🤑</div>
                <h1 class="title-main">Chochi<br><span style="color:#fff; font-size:16px;">VS</span><br>Contrato</h1>
            </div>

            <!-- Icono BMW dibujado en SVG interactivo en título -->
            <div class="decor-car">
                <img src="carromato.png" alt="Carromato Decorativo" style="width:100%; height:100%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(0, 243, 255, 0.6));">
            </div>

            <div class="start-container">
                <button class="btn-premium" id="start-btn">PULSAR START 🤑</button>
            </div>

            <div class="footer-credits">PROYECTO CHOCHI-RETRO v2.5</div>
        </div>

        <!-- PANTALLA COMBATE -->
        <div class="screen" id="battle-screen">
            <div class="battle-arena" id="battle-arena">
                <!-- Capa de partículas e impactos -->
                <canvas id="effects-canvas"></canvas>
                <div class="arena-grid"></div>

                <!-- Contenedor Tarjeta HP Enemigo -->
                <div class="hp-card-wrapper enemy-hp" id="enemy-box">
                    <div class="hp-card">
                        <div class="hp-info">
                            <span class="hp-name">Contrato</span>
                            <span class="hp-lvl">Lv.50</span>
                        </div>
                        <div class="hp-track">

    <script>
    // ===== AUDIO ENGINE (Web Audio API Synthesizer) =====
    const AudioEngine = {
        ctx: null,
        isMuted: true,
        bgmInterval: null,
        bgmTime: 0,
        bpm: 125,

        init() {
            if (this.ctx) return;
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioCtx();
        },

        toggleMute() {
            this.isMuted = !this.isMuted;
            if (!this.isMuted) {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.playBgm();
            } else {
                this.stopBgm();
            }
            return this.isMuted;
        },

        // Generador de sonidos básicos por nodos de Web Audio API
        playOsc(type, freq, duration, gainStart, freqEnd = null) {
            if (this.isMuted || !this.ctx) return;
            try {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                if (freqEnd !== null) {
                    osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
                }
                
                gain.gain.setValueAtTime(gainStart, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            } catch(e) {}
        },

        // Ruido para golpes y efectos
        playNoise(duration, gainStart, lowPassFreq = 1000, highPassFreq = null) {
            if (this.isMuted || !this.ctx) return;
            try {
                const bufferSize = this.ctx.sampleRate * duration;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);
                
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;
                
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(gainStart, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + duration);
                
                let lastNode = noise;
                
                if (lowPassFreq) {
                    const lp = this.ctx.createBiquadFilter();
                    lp.type = 'lowpass';
                    lp.frequency.setValueAtTime(lowPassFreq, this.ctx.currentTime);
                    lastNode.connect(lp);
                    lastNode = lp;
                }
                if (highPassFreq) {
                    const hp = this.ctx.createBiquadFilter();
                    hp.type = 'highpass';
                    hp.frequency.setValueAtTime(highPassFreq, this.ctx.currentTime);
                    lastNode.connect(hp);
                    lastNode = hp;
                }
                
                lastNode.connect(gain);
                gain.connect(this.ctx.destination);
                
                noise.start();
            } catch(e) {}
        },

        playHit() {
            // Explosión de ruido retro
            this.playOsc('sawtooth', 120, 0.15, 0.1, 40);
            this.playNoise(0.2, 0.15, 800);
        },

        playHeal() {
            // Arpegio curativo ascendente de ondas triangulares
            const now = this.ctx ? this.ctx.currentTime : 0;
            const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99]; // Do, Mi, Sol...
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    this.playOsc('triangle', freq, 0.25, 0.08, freq * 1.5);
                }, idx * 60);
            });
        },

        playSlash() {
            // Sonido metálico rápido de corte (Uñas afiladas)
            this.playOsc('sawtooth', 800, 0.12, 0.12, 100);
            this.playNoise(0.12, 0.15, 2000, 400);
        },

        playToxic() {
            // Burbujeo de gas (Olor a chorizo)
            for (let i = 0; i < 6; i++) {
                setTimeout(() => {
                    const freq = 120 + Math.random() * 250;
                    this.playOsc('sine', freq, 0.1, 0.08, freq - 60);
                }, i * 50);
            }
        },

        playDrift() {
            // Derrape chillón y choque estrepitoso
            this.playOsc('triangle', 950, 0.6, 0.1, 1050); // Chillido de rueda
            this.playNoise(0.5, 0.08, 3000, 800);
            setTimeout(() => {
                this.playOsc('square', 80, 0.4, 0.3, 30); // Impacto
                this.playNoise(0.4, 0.25, 600);
            }, 600);
        },

        playTextBeep() {
            // Pequeño click de letra tipeada
            this.playOsc('sine', 1500, 0.02, 0.02);
        },

        playVictory() {
            this.stopBgm();
            const notes = [261.63, 261.63, 261.63, 261.63, 349.23, 440.00, 523.25, 440.00, 523.25];
            const times = [0, 100, 200, 300, 400, 600, 800, 950, 1100];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    this.playOsc('triangle', freq, 0.25, 0.15);
                }, times[idx]);
            });
        },

        playDefeat() {
            this.stopBgm();
            const notes = [392.00, 349.23, 311.13, 261.63];
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    this.playOsc('sine', freq, 0.5, 0.15, freq - 80);
                }, idx * 250);
            });
        },

        // Generador de música procedimental 8 bits (Chiptune loop)
        playBgm() {
            this.stopBgm();
            if (this.isMuted) return;

            let step = 0;
            const bass = [55, 55, 65.41, 65.41, 73.42, 73.42, 82.41, 82.41]; // La1, Do2, Re2, Mi2
            const melody = [
                220.00, 0, 261.63, 293.66, 329.63, 0, 293.66, 261.63,
                220.00, 0, 329.63, 0, 392.00, 329.63, 293.66, 0
            ];

            const stepDuration = 60000 / this.bpm / 2; // Corcheas

            this.bgmInterval = setInterval(() => {
                if (this.isMuted || !this.ctx) return;
                
                // Bass note every quarter note (every 2 steps)
                if (step % 2 === 0) {
                    const bFreq = bass[Math.floor(step / 2) % bass.length];
                    this.playOsc('sawtooth', bFreq, stepDuration / 1000 * 0.9, 0.04);
                }

                // Lead melody every step
                const mFreq = melody[step % melody.length];
                if (mFreq > 0 && Math.random() > 0.15) {
                    this.playOsc('triangle', mFreq, stepDuration / 1000 * 0.7, 0.035);
                }

                step++;
            }, stepDuration);
        },

        stopBgm() {
            if (this.bgmInterval) {
                clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            }
        }
    };

    // ===== MOTOR DE PARTÍCULAS (HTML5 Canvas) =====
    const CanvasParticles = {
        canvas: null,
        ctx: null,
        particles: [],
        animId: null,

        init() {
            this.canvas = document.getElementById('effects-canvas');
            this.ctx = this.canvas.getContext('2d');
            this.resize();
            window.addEventListener('resize', () => this.resize());
            this.loop();
        },

        resize() {
            const rect = this.canvas.parentElement.getBoundingClientRect();
            this.canvas.width = rect.width;
            this.canvas.height = rect.height;
        },

        spawn(x, y, color, speed, size, count, type = 'normal') {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const spd = (0.5 + Math.random() * 1.5) * speed;
                this.particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    color,
                    size: (0.4 + Math.random() * 0.6) * size,
                    life: 1.0,
                    decay: 0.015 + Math.random() * 0.02,
                    type
                });
            }
        },

        // Spawn de barra de cortes (uñas)
        spawnSlash(x, y) {
            this.particles.push({
                type: 'custom_slash',
                x, y,
                life: 1.0,
                decay: 0.06,
                angles: [Math.PI/6, Math.PI/4, -Math.PI/6]
            });
        },

        loop() {
            this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
            
            for (let i = this.particles.length - 1; i >= 0; i--) {
                const p = this.particles[i];
                p.life -= p.decay;
                
                if (p.life <= 0) {
                    this.particles.splice(i, 1);
                    continue;
                }

                if (p.type === 'custom_slash') {
                    // Dibuja garras de neón
                    this.ctx.strokeStyle = `rgba(255, 0, 127, ${p.life})`;
                    this.ctx.lineWidth = 4 * p.life;
                    this.ctx.shadowBlur = 15;
                    this.ctx.shadowColor = '#ff007f';
                    
                    const size = 60 * (2 - p.life);
                    p.angles.forEach((ang, k) => {
                        const shift = (k - 1) * 15;
                        this.ctx.beginPath();
                        this.ctx.moveTo(p.x - Math.cos(ang)*size/2 + shift, p.y - Math.sin(ang)*size/2);
                        this.ctx.lineTo(p.x + Math.cos(ang)*size/2 + shift, p.y + Math.sin(ang)*size/2);
                        this.ctx.stroke();
                    });
                    this.ctx.shadowBlur = 0; // Reset
                } 
                else if (p.type === 'gaseous') {
                    // Gas de chorizo (verde y amarillento tóxico)
                    p.x += p.vx + Math.sin(p.life * 10) * 0.8;
                    p.y += p.vy;
                    p.size += 0.4;
                    this.ctx.fillStyle = p.color.replace('ALPHA', p.life * 0.4);
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    this.ctx.fill();
                }
                else {
                    // Partícula estándar con física simple
                    p.x += p.vx;
                    p.y += p.vy;
                    
                    if (p.type === 'heal_star') {
                        p.vy -= 0.15; // Flotan hacia arriba
                        this.ctx.fillStyle = `rgba(0, 255, 102, ${p.life})`;
                        this.ctx.font = `${p.size * 2}px Outfit`;
                        this.ctx.fillText('★', p.x, p.y);
                    } else {
                        this.ctx.fillStyle = p.color.replace('ALPHA', p.life);
                        this.ctx.beginPath();
                        this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        this.ctx.fill();
                    }
                }
            }

            this.animId = requestAnimationFrame(() => this.loop());
        }
    };

    // ===== CONTROL DE ESTADOS DEL COMBATE =====

    // ===== SECUENCIA ANIMACIÓN BMW =====
    function animateBMW() {
        return new Promise(resolve => {
            const actor = $('bmw-actor');
            actor.style.display = 'block';
            actor.style.left = '-250px';
            actor.style.transform = 'scaleX(1) rotate(0deg)';

            const arenaWidth = $('battle-arena').clientWidth;
            const enemyBox = $('enemy-sprite').getBoundingClientRect();
            const arenaRect = $('battle-arena').getBoundingClientRect();
            const targetX = enemyBox.left - arenaRect.left - 50;

            let x = -250;
            let speed = 12;
            let stage = 'driving';
            let rotation = 0;
            
            // Sonido de derrape al inicio
            AudioEngine.playDrift();

            function update() {
                if (stage === 'driving') {
                    x += speed;
                    actor.style.left = x + 'px';
                    
                    // Humo del derrape inicial
                    if (x > 0 && Math.random() > 0.4) {
                        CanvasParticles.spawn(x + 20, 270, 'rgba(200,200,200,ALPHA)', 2, 4, 3, 'normal');
                    }

                    if (x >= targetX) {
                        stage = 'drift';
                    }
                } 
                else if (stage === 'drift') {
                    // Hace un trompo rotatorio (360) chocando al enemigo
                    rotation += 22;
                    actor.style.transform = `scaleX(1) rotate(${-rotation}deg)`;
                    
                    // Spawnea chispas e impactos y mucho humo de neumáticos
                    CanvasParticles.spawn(x + 60, 270, 'rgba(255, 100, 0, ALPHA)', 4, 3, 4);
                    CanvasParticles.spawn(x + 20, 280, 'rgba(230,230,230,ALPHA)', 3, 6, 6);

                    if (rotation >= 360) {
                        stage = 'exit';
                        actor.style.transform = 'scaleX(1) rotate(0deg)';
                    }
                } 
                else if (stage === 'exit') {
                    x += speed * 1.5;
                    actor.style.left = x + 'px';
                    if (x > arenaWidth + 200) {
                        actor.style.display = 'none';
                        resolve();
                        return; // Terminar bucle
                    }
                }
                
                requestAnimationFrame(update);
            }
            
            requestAnimationFrame(update);
        });
    }

    // ===== EJECUCIÓN TURNOS =====
    async function handlePlayerTurn(idx) {
        const move = CONFIG.PLAYER.moves[idx];
        state.player.pp[idx]--;
        
        await printMsg(`¡CHOCHI usó ${move.name.toUpperCase()}!`);
        
        // Desplazamiento rápido al golpear
        const pSprite = $('player-sprite');
        const eSprite = $('enemy-sprite');
        
        if (move.type === 'heal') {
            pSprite.classList.add('heal-glow');
            AudioEngine.playHeal();
            
            // Partículas curativas
            const pBox = pSprite.getBoundingClientRect();
            const arenaRect = $('battle-arena').getBoundingClientRect();
            const px = pBox.left - arenaRect.left + pBox.width/2;
            const py = pBox.top - arenaRect.top + pBox.height/2;
            CanvasParticles.spawn(px, py, 'rgba(57,255,20,ALPHA)', 2, 6, 20, 'heal_star');

            // Curar
            const healVal = state.player.maxHp * (move.heal / 100);
            state.player.hp = Math.min(state.player.maxHp, state.player.hp + healVal);
            updateHpBars();
            spawnFloatingNum(healVal, true, false);

            await printMsg(move.msg[Math.floor(Math.random()*move.msg.length)]);
            pSprite.classList.remove('heal-glow');
            return;
        }

        // Ataques que golpean
        if (move.type === 'bmw') {
            // Animación espectacular del BMW
            await animateBMW();
        } else {
            pSprite.classList.add('attack-dash-right');
            
            // Sonido de ataque
            if (move.type === 'slash') AudioEngine.playSlash();
            else if (move.type === 'toxic') AudioEngine.playToxic();
            else AudioEngine.playOsc('sine', 400, 0.15, 0.1, 100);
            
            await new Promise(r => setTimeout(r, 180));
            pSprite.classList.remove('attack-dash-right');
        }

        // Comprobación de fallo
        if (Math.random() * 100 > move.accuracy) {
            await printMsg("¡El ataque falló! Chochi: 'Bro chill... q me da pereza' 🤑");
            return;
        }

        // Efectos especiales visuales en Canvas
        const eBox = eSprite.getBoundingClientRect();
        const arenaRect = $('battle-arena').getBoundingClientRect();
        const ex = eBox.left - arenaRect.left + eBox.width/2;
        const ey = eBox.top - arenaRect.top + eBox.height/2;

        if (move.type === 'slash') {
            CanvasParticles.spawnSlash(ex, ey);
        } else if (move.type === 'toxic') {
            // Nube tóxica
            CanvasParticles.spawn(ex, ey, 'rgba(100, 220, 0, ALPHA)', 1.5, 8, 25, 'gaseous');
            state.enemyDefenseMod = 0.7; // Reduce defensa del enemigo
        } else if (move.type === 'bmw') {
            CanvasParticles.spawn(ex, ey, 'rgba(255, 220, 0, ALPHA)', 4, 4, 30);
        } else {
            CanvasParticles.spawn(ex, ey, 'rgba(0, 243, 255, ALPHA)', 3, 3, 12);
        }

        // Impactar
        eSprite.classList.add('damage-blink');
        AudioEngine.playHit();
        
        let powerVal = move.power;
        // Si usamos Uñas Afiladas, aumenta probabilidad crítico
        let isCrit = Math.random() < (move.type === 'slash' ? 0.35 : 0.1);
        let critMult = isCrit ? 1.5 : 1.0;
        
        // Daño basado en stats
        const damage = Math.floor(powerVal * (CONFIG.PLAYER.atk / (CONFIG.ENEMY.def * state.enemyDefenseMod)) * (0.85 + Math.random() * 0.15) * critMult);
        
        state.enemy.hp -= damage;
        updateHpBars();
        spawnFloatingNum(damage, false, true);

        if (isCrit) {
            await printMsg("¡GOLPE CRÍTICO! ¡Eso es loco, manín!");
        }

        await printMsg(move.msg[Math.floor(Math.random()*move.msg.length)]);
        eSprite.classList.remove('damage-blink');
    }

    async function handleEnemyTurn() {
        const move = CONFIG.ENEMY.moves[Math.floor(Math.random() * CONFIG.ENEMY.moves.length)];
        
        await printMsg(`¡El CONTRATO usó ${move.name.toUpperCase()}!`);
        
        const eSprite = $('enemy-sprite');
        const pSprite = $('player-sprite');
        
        eSprite.classList.add('attack-dash-left');
        AudioEngine.playOsc('sawtooth', 200, 0.2, 0.12, 50);
        await new Promise(r => setTimeout(r, 180));
        eSprite.classList.remove('attack-dash-left');

        if (Math.random() * 100 > move.accuracy) {
            await printMsg("¡El Contrato tiene defectos de forma! ¡Fallo total!");
            return;
        }

        // Partículas del enemigo
        const pBox = pSprite.getBoundingClientRect();
        const arenaRect = $('battle-arena').getBoundingClientRect();
        const px = pBox.left - arenaRect.left + pBox.width/2;
        const py = pBox.top - arenaRect.top + pBox.height/2;
        CanvasParticles.spawn(px, py, 'rgba(255, 0, 127, ALPHA)', 2.5, 3.5, 12);

        // Impacto
        pSprite.classList.add('damage-blink');
        AudioEngine.playHit();
        
        const damage = Math.floor(move.power * (CONFIG.ENEMY.atk / CONFIG.PLAYER.def) * (0.85 + Math.random() * 0.15));
        state.player.hp -= damage;
        updateHpBars();
        spawnFloatingNum(damage, false, false);

        await printMsg(move.msg[0]);
        pSprite.classList.remove('damage-blink');
    }

    // ===== BUCLE PRINCIPAL DEL COMBATE =====
    async function startBattle() {
        state = {
            player: { hp: CONFIG.PLAYER.maxHp, maxHp: CONFIG.PLAYER.maxHp, pp: [...CONFIG.PLAYER.moves.map(m=>m.maxPp)] },
            enemy: { hp: CONFIG.ENEMY.maxHp, maxHp: CONFIG.ENEMY.maxHp },
            turnCount: 0,
            playerCritBoost: 1.0,
            enemyDefenseMod: 1.0,
            inBattle: true
        };

        // Reset de sprites
        $('player-sprite').className = 'sprite-wrapper';
        $('enemy-sprite').className = 'sprite-wrapper';
        
        updateHpBars();
        showScreen('battle-screen');
        
        // Sonidos y música al empezar combate
        if (!AudioEngine.isMuted) {
            AudioEngine.playBgm();
        }

        await printMsg("¡Un CONTRATO salvaje de consultoría explotadora apareció!");
        await printMsg("¡Ve, CHOCHI! ¡Arranca el carromato y hazle unos ceros!");

        while (state.player.hp > 0 && state.enemy.hp > 0) {
            state.turnCount++;
            await typeDialogue("¿Qué locura hará CHOCHI ahora?");
            
            const actionIdx = await drawActionGrid(true);
            drawActionGrid(false); // Esconde menú
            
            await handlePlayerTurn(actionIdx);
            
            if (state.enemy.hp <= 0) break;
            
            await handleEnemyTurn();
        }

        state.inBattle = false;
        
        // Finalización
        if (state.player.hp <= 0) {
            // Derrota
            $('player-sprite').classList.add('faint-sink');
            AudioEngine.playDefeat();
            
            $('result-screen').className = 'screen defeat';
            $('result-title').innerHTML = "<span class='lose-text'>ESTÁS DONETTE 💀</span>";
            $('result-message').innerHTML = `
                El Contrato te ha vencido. Te toca madrugar a las 8 AM todos los días. 
                <br>Se acabaron las copas en el Soho y salir con las petis.
                <br>Chochi dice: <em>"Amai, me la aplicaste ahí manín..."</em>.
            `;
            $('result-stats').innerHTML = `Turnos aguantados: ${state.turnCount}`;
        } else {
            // Victoria
            $('enemy-sprite').classList.add('faint-sink');
            AudioEngine.playVictory();
            
            $('result-screen').className = 'screen win';
            $('result-title').innerHTML = "<span class='win-text'>D1 BANCAZO 🏆</span>";
            $('result-message').innerHTML = `
                ¡CONTRATO DESTRUIDO!
                <br>Has defendido tu derecho a no hacer nada y cobrar. 
                <br>El BMW sigue a salvo en el garaje listo para venderlo por 10000 rupias 🤑.
                <br>Chochi dice: <em>"¡AMAI GANÉ! ¡Es top! A beber unas birras y chillear."</em>.
            `;
            $('result-stats').innerHTML = `BMW en garaje: SÍ 🚗 | Valor: 10000€`;
        }

        showScreen('result-screen');
    }

    // Inicializaciones generales
    $('start-btn').onclick = () => {
        // Inicializar sintetizador al primer toque (políticas navegador)
        AudioEngine.init();
        if (AudioEngine.isMuted) {
            // Forzar encendido en el primer click
            AudioEngine.toggleMute();
            audioToggle.textContent = '🔊';
            audioToggle.classList.add('neon-active');
        }
        startBattle();
    };

    $('restart-btn').onclick = () => {
        startBattle();
    };

    // Lanzar motor de partículas
    CanvasParticles.init();
    </script>
</body>
</html>
